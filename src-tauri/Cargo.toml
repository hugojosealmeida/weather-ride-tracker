[package]
name = "weather-ride-tracker"
version = "0.1.0"
description = "RideCast - a weather-aware ride planner"
authors = ["Hugo Almeida"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "weather_ride_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
